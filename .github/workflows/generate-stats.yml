name: Generate Stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full regeneration (all years)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run generate${{ inputs.full == true && ':full' || '' }}
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ -f
          git diff --cached --quiet || git commit -m "Update stats $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
